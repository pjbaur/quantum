name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ['1.25.x', '1.26.x']
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go-version }}
          # No dependencies, so no go.sum to key a module cache on.
          cache: false

      - name: Go fmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt needed:"
            echo "$unformatted"
            exit 1
          fi

      - name: Go vet
        run: go vet ./...

      - name: Staticcheck
        # Lint once, on the newest Go in the matrix: staticcheck@latest
        # tracks the current Go release and won't build on older ones
        # now that setup-go@v6 pins GOTOOLCHAIN=local.
        if: matrix.go-version == '1.26.x'
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@latest
          staticcheck ./...

      - name: Go test (race detector)
        run: go test -race ./...

      - name: Coverage
        run: |
          go test ./... -coverprofile=coverage.out
          total=$(go tool cover -func=coverage.out | awk '/^total:/ {print substr($3, 1, length($3)-1)}')
          echo "Total coverage: ${total}%"
          threshold=50.0
          awk -v total="$total" -v threshold="$threshold" 'BEGIN { if (total + 0 < threshold + 0) { printf("Coverage %.1f%% is below %.1f%%\n", total, threshold); exit 1 } }'
